[package]
name = "stimtake-rust-deck"
version = "0.2.0"
edition = "2021"
description = "StimTake desktop app with embedded HTML deck UI and local OBS overlay server"
license = "MIT"

[dependencies]
wry = "0.53"
tao = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_SystemInformation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[[bin]]
name = "StimTake"
path = "src/main.rs"
