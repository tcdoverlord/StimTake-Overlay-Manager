<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Star Spangled Pick — StimTake</title>
<style>
:root{--c1:#1d4ed8;--c2:#dc2626;--c3:#f8fafc;}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:system-ui,Segoe UI,sans-serif;color:#fff}
.stage{position:relative;width:100%;height:100%;display:grid;place-items:center;isolation:isolate}
.glow{position:absolute;width:min(70vw,70vh);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle, color-mix(in srgb,var(--c1) 45%,transparent),transparent 68%);filter:blur(8px);animation:pulse 3s ease-in-out infinite}
.card{position:relative;max-width:min(88vw,900px);padding:clamp(22px,4vw,54px) clamp(28px,6vw,78px);border:2px solid color-mix(in srgb,var(--c2) 80%,white);border-radius:28px;text-align:center;background:linear-gradient(135deg,color-mix(in srgb,var(--c1) 82%,#111827),color-mix(in srgb,var(--c2) 42%,#111827));box-shadow:0 0 36px color-mix(in srgb,var(--c1) 48%,transparent),inset 0 0 28px #ffffff12;animation:enter .75s cubic-bezier(.2,.8,.2,1) both}
.emoji{font-size:clamp(42px,9vw,100px);line-height:1.1;filter:drop-shadow(0 4px 16px #0007);animation:float 2.8s ease-in-out infinite}
h1{font-size:clamp(24px,5vw,58px);margin:14px 0 8px;text-shadow:0 4px 18px #0008}
p{font-size:clamp(12px,2vw,22px);margin:0;letter-spacing:.18em;text-transform:uppercase;color:#fffde8}
.spark{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--c3);box-shadow:0 0 20px var(--c3);animation:drift 4s linear infinite;opacity:.8}
.spark:nth-child(2){left:15%;top:20%;animation-delay:-1s}.spark:nth-child(3){right:17%;top:28%;animation-delay:-2s}.spark:nth-child(4){left:25%;bottom:18%;animation-delay:-3s}.spark:nth-child(5){right:22%;bottom:17%;animation-delay:-1.5s}
@keyframes enter{from{opacity:0;transform:translateY(24px) scale(.94)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes float{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-12px) rotate(3deg)}}
@keyframes pulse{0%,100%{transform:scale(.92);opacity:.55}50%{transform:scale(1.08);opacity:1}}
@keyframes drift{0%{transform:translateY(25px) scale(.4);opacity:0}30%{opacity:1}100%{transform:translateY(-55px) scale(1.2);opacity:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}
</style>
</head>
<body>
<div class="stage" role="img" aria-label="Star Spangled Pick themed overlay">
<div class="glow"></div>
<div class="spark" style="left:35%;top:15%"></div><div class="spark"></div><div class="spark"></div><div class="spark"></div><div class="spark"></div>
<div class="card"><div class="emoji">🎆</div><h1>Star Spangled Pick</h1><p>STIMTAKE • Independence Day Pack</p></div>
</div>
</body>
</html>
